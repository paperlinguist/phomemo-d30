[workspace]
resolver = "2"
members = ["d30", "cli", "cli-preview"]
# The GUI is a workspace of its own (see gui/Cargo.toml): the egui version it needs cannot share
# a lockfile with the show-image preview helper, which pins an old web-sys.
exclude = ["gui"]

package.version = "0.2.3"
package.edition = "2021"
package.license = "AGPL-3.0-or-later"
package.description = "Provisional userspace driver/app for the Phomemo D30 label maker / printer"
package.keywords = ["driver", "hardware"]
package.repository = "https://github.com/crabdancing/phomemo-d30"

[workspace.dependencies]
# IMPORTANT: always bump these when bumping package version
d30 = "0.2.3"

# Linux (BlueZ) Bluetooth backend. It only builds on Linux, so the d30 library enables it per-target.
bluetooth-serial-port-async = "0.6.3"
derive_more = "0.99.17"
dimensions = "0.1.0"
image = { version = "0.24.6", features = ["jpeg", "dds"] }
imageproc = "0.23.0"
# QR codes for labels (only the squares: the drawing is done by d30), and a reader that the tests use.
qrcode = { version = "0.14", default-features = false }
rqrr = "0.6"
rusttype = { version = "0.9.3", features = ["gpu_cache"] }
tokio = { version = "1.29.1", features = ["full"] }
clap = { version = "4.3.19", features = ["derive"] }
env_logger = "0.11.1"
log = "0.4.19"
advmac = "1.0.3"
inquire = "0.6.2"
serde = { version = "1.0.178", features = ["derive", "rc"] }
dirs = "7.0.0"
fontdb = "0.24.0"
temp-file = "0.1.7"
png = "0.17.10"
unescape = "0.1.0"
toml = { version = "0.7.6", features = ["indexmap", "preserve_order"] }
indexmap = { version = "2.0.0", features = ["serde"] }
show-image = { version = "0.13.1", features = ["image", "save"] }
snafu = "0.8.0"
# Windows Bluetooth backend: RFCOMM sockets via Winsock (AF_BTH), plus listing paired devices.
# Only the d30 library uses it, and only on Windows.
windows-sys = { version = "0.59.0", features = ["Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Networking_WinSock"] }

[patch.crates-io]
d30 = { path = "./d30" }
