[package]
name = "d30"
description.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true

[dependencies]
dimensions.workspace = true
derive_more.workspace = true
image.workspace = true
imageproc.workspace = true
qrcode.workspace = true
rusttype.workspace = true
snafu.workspace = true
toml.workspace = true
serde.workspace = true
dirs.workspace = true
fontdb.workspace = true
indexmap.workspace = true
advmac.workspace = true
log.workspace = true

[dev-dependencies]
rqrr.workspace = true

[features]
default = ["bluetooth"]
# The Bluetooth link to the printer (BlueZ on Linux, Winsock on Windows). Turn it off to use only
# the rendering and protocol parts of the library, for instance where libbluetooth is not installed.
bluetooth = ["dep:bluetooth-serial-port-async", "dep:windows-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
bluetooth-serial-port-async = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }
